services:
  db-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: vault_test
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d vault_test"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis-test:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10

  test-runner:
    build: 
      context: ./backend
      dockerfile: docker/Dockerfile
    # Run pytest directly instead of starting the server
    command: >
      bash -c "pip install pytest pytest-asyncio pytest-cov && pytest tests/ -v"
    environment:
      - ENVIRONMENT=test
      - DATABASE_URL=postgresql+asyncpg://testuser:testpassword@db-test:5432/vault_test
      - REDIS_URL=redis://redis-test:6379/0
      - REDIS_BROKER_URL=redis://redis-test:6379/1
      - REDIS_BACKEND_URL=redis://redis-test:6379/2
      - JWT_SECRET_KEY=test-secret-key-123
      - SECRET_KEY=test-secret-key-123
      - CORS_ORIGINS=["http://localhost"]
      - RATE_LIMIT=1000/minute
    depends_on:
      db-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    volumes:
      # Mount the backend directory so tests update in real-time
      - ./backend:/app
