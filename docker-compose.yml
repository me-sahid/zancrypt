
services:
  db:
    image: postgres:15-alpine
    env_file:
      - ./server/.env
    environment:
      POSTGRES_DB: vault
      POSTGRES_USER: user
      POSTGRES_PASSWORD: vaultpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d vault"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: 
      context: ./server
      dockerfile: docker/Dockerfile
    env_file:
      - ./server/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
    tmpfs:
      - /dev/shm/vault_staging:size=512M

  worker:
    build:
      context: ./server
      dockerfile: docker/Dockerfile
    command: celery -A app.workers.celery_app worker --loglevel=info
    env_file:
      - ./server/.env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
    tmpfs:
      - /dev/shm/vault_staging:size=512M

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    depends_on:
      - server

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./server/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
      - web

volumes:
  postgres_data:
